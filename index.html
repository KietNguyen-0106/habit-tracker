<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nhật ký thói quen</title>
<meta name="theme-color" content="#1c98d4">
<meta name="description" content="Theo dõi thói quen, trồng cây cho mỗi thói quen, chạy cả khi không có mạng.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thói quen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first single column — sticky header + week strip, pastel habit cards, garden scene, fixed bottom nav with centre add button */
:root{
  --bg:#e7edf3; --surface:#f6f9fc; --ink:#1e3354; --muted:#5a6b83; --line:#c8d5e2;
  --accent:#1c98d4; --accent-ink:#ffffff; --soil:#9b7653; --sky1:#cfe8f6; --sky2:#eef7e9;
  --mix:30%; --f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151e; --surface:#17212d; --ink:#e2eaf4; --muted:#93a3b8; --line:#2a3747;
    --accent:#4bb7ea; --accent-ink:#04202e; --soil:#6d523a; --sky1:#132a44; --sky2:#1d3328; --mix:26%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151e; --surface:#17212d; --ink:#e2eaf4; --muted:#93a3b8; --line:#2a3747;
  --accent:#4bb7ea; --accent-ink:#04202e; --soil:#6d523a; --sky1:#132a44; --sky2:#1d3328; --mix:26%; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,label,a,input,select{touch-action:manipulation}
/* No text selection or long-press callout, except inside fields */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none}
/* iOS zooms into inputs under 16px: keep every field at 16px */
input,select,textarea{font-size:16px!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:600px;margin:0 auto;min-height:100%}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-bottom:10px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.brand i{width:7px;height:7px;border-radius:50%;background:transparent;display:inline-block}
.brand i[data-s="pending"],.brand i[data-s="saving"]{background:#e3a33b}
.brand i[data-s="error"]{background:#d9534f}
.title{font-weight:700;font-size:17px;text-align:center;white-space:nowrap}
.bar-r{display:flex;justify-content:flex-end;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:18px;height:18px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;border-top:1px solid var(--line);padding:10px 0}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:14px;color:var(--accent);position:relative}
.day small{font-size:13px;font-weight:500}
.day b{font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.day.sel{background:var(--accent)}
.day.sel small,.day.sel b{color:var(--accent-ink)}
.day.today:not(.sel)::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day:disabled{opacity:.35;cursor:default}
.subbar{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0 12px}
.seg{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:11px 0;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip-btn{padding:8px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;white-space:nowrap}

main{padding:4px 16px calc(110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}

/* summary line */
.sum{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.sum .track{flex:1;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.sum .track i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.sum b{color:var(--ink)}

/* habit cards */
.card{--c:color-mix(in srgb,var(--hc) var(--mix),var(--surface));background:var(--c);border-radius:14px;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:14px 14px 16px}
.card .body{flex:1;display:flex;gap:12px;align-items:center;text-align:left;min-width:0}
.emo{font-size:34px;line-height:1;width:44px;flex:none;text-align:center}
.info{min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.done .nm{text-decoration:line-through;text-decoration-thickness:2px;opacity:.75}
.desc{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:10px;margin-top:3px;font-size:13px;font-weight:600;color:var(--muted)}
.tag{padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--hc) 30%,transparent);border:1px solid color-mix(in srgb,var(--hc) 40%,transparent);color:var(--ink);font-weight:600}
.pill{flex:none;min-width:64px;height:40px;padding:0 10px;border-radius:999px;border:2.5px solid var(--hc);background:var(--surface);font-weight:700;font-size:14px;color:color-mix(in srgb,var(--hc) 75%,var(--ink));font-variant-numeric:tabular-nums;transition:transform .12s}
.pill.zero{border-color:var(--line);color:var(--muted)}
.pill.circle{min-width:40px;width:40px;padding:0;border-color:var(--line);display:grid;place-items:center}
.pill.circle.on{background:var(--hc);border-color:var(--hc)}
.pill svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none}
.pill:active:not(:disabled){transform:scale(.92)}
.pill:disabled{opacity:.4;cursor:default}
.medal{position:absolute;top:6px;right:10px;font-size:18px}
.prog{position:absolute;left:0;bottom:0;height:5px;background:var(--hc);transition:width .3s}

.grp{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.mvs{display:flex;gap:6px;flex:none}
.mvs .ib{width:40px;height:40px;border-radius:50%}
.card.reo .body{cursor:default}
.sum .lnk{font-size:14px;white-space:nowrap}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchip .sw{width:14px;height:14px;border-radius:4px}
.fchip svg{width:16px;height:16px}
.fchip .n{background:var(--accent-ink);color:var(--accent);border-radius:999px;padding:0 6px;font-size:12px}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup h4{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.fgroup .wrap{display:flex;flex-wrap:wrap;gap:8px}
.search{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
/* tasks */
.taskadd{display:flex;gap:8px}
.taskadd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.task .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.task.on .tx{text-decoration:line-through;color:var(--muted)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.task.on .chk{background:var(--accent);border-color:var(--accent)}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3.5;fill:none}
.x{color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:8px}

.empty{text-align:center;color:var(--muted);padding:36px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lnk{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* garden */
.scene{border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));position:relative;padding:18px 12px 0}
.scene .sun{position:absolute;top:14px;right:18px;width:38px;height:38px;border-radius:50%;background:#ffd36b;box-shadow:0 0 0 8px rgba(255,211,107,.25)}
:root[data-theme="dark"] .scene .sun{background:#e8eef7;box-shadow:0 0 0 8px rgba(232,238,247,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scene .sun{background:#e8eef7;box-shadow:0 0 0 8px rgba(232,238,247,.12)}}
.scene h2{margin:0;font-size:20px;font-weight:800;position:relative}
.scene p{margin:2px 0 0;font-size:14px;color:var(--muted);position:relative}
.row-plants{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;padding:10px 4px 0;margin-top:6px;position:relative;scrollbar-width:none}
.row-plants .pl{flex:none;width:78px;display:flex;flex-direction:column;align-items:center}
.row-plants svg{width:78px;height:94px}
.ground{height:22px;background:var(--soil);margin:0 -12px;border-top:4px solid color-mix(in srgb,#5fae5f 70%,var(--soil))}
.plots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plot{--c:color-mix(in srgb,var(--hc) var(--mix),var(--surface));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.plot svg{width:100%;max-width:120px;height:116px}
.plot .pn{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.plot .ps{font-size:13px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--c)}
.badge.thirsty{background:#f3dcc4;color:#8a4b12}
.mini{width:100%;height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--hc)}
.wilt{filter:saturate(.3) brightness(.92)}
.wilt .crown{transform:rotate(7deg);transform-origin:50px 108px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.tile span{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:16px;font-weight:700}
.wgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,30px);gap:6px 4px;align-items:center}
.wgrid .hd{font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.wgrid .hd b{display:block;font-size:13px;color:var(--ink)}
.wgrid .hn{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc{width:28px;height:28px;border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center}
.wc.part{background:color-mix(in srgb,var(--hc) 35%,transparent);border-style:solid;border-color:transparent}
.wc.on{background:var(--hc);border:0}
.wc svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none}
.wc:disabled{opacity:.3;cursor:default}
.hrow{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0;padding-top:0}
.hhead{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hhead b{font-size:15px}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px}
.heat i{border-radius:2px;background:var(--line);opacity:.6}
.heat i.p{background:var(--hc);opacity:.45}
.heat i.on{background:var(--hc);opacity:1}
.heat i.f{background:transparent}

/* settings */
.btn{border-radius:12px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid #d9534f;color:#d9534f}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.cap{font-size:13px;color:var(--muted)}

/* bottom nav */
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:66px}
.nav-in > button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);padding-bottom:9px}
.nav-in > button svg{width:25px;height:25px}
.nav-in > button[aria-current="page"]{color:var(--accent)}
.nav-in > .fab{padding:0;gap:0;display:grid;color:var(--accent-ink)}
.fab{justify-self:center;align-self:start;margin-top:-26px;width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab svg{width:28px;height:28px}

/* sheet */
.ov{position:fixed;inset:0;z-index:20;background:rgba(8,14,22,.45);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head h2{margin:0;font-size:21px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.counter{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 0}
.counter .ib{width:52px;height:52px;border-radius:50%;font-size:26px;font-weight:700}
.counter input{width:110px;text-align:center;font-size:34px!important;font-weight:800;border:0;background:transparent;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.counter input::-webkit-outer-spin-button,.counter input::-webkit-inner-spin-button{-webkit-appearance:none}
.goal-l{text-align:center;color:var(--muted);font-size:14px;margin-top:-8px}
.plant-hero{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,var(--sky1),var(--sky2));border-radius:14px;padding:8px 14px}
.plant-hero svg{width:96px;height:110px;flex:none}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats4 div{background:var(--bg);border-radius:10px;padding:8px}
.stats4 b{display:block;font-size:19px;font-weight:800}
.stats4 span{font-size:11px;color:var(--muted)}
form.f{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.fld input,.fld select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);min-width:0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{position:relative}
.pick input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.pick span{display:grid;place-items:center;min-width:42px;height:42px;padding:0 8px;border-radius:10px;background:var(--bg);border:2px solid transparent;font-size:22px}
.pick.sw span{min-width:32px;width:32px;height:32px}
.pick.pl span{font-size:13px;font-weight:600;color:var(--ink);gap:4px;display:flex;align-items:center;padding:0 10px}
.pick.pl span svg{width:26px;height:30px}
.pick input:checked+span{border-color:var(--ink)}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:30;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:380px){.nm{font-size:16px}.emo{font-size:28px;width:36px}.plots{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav class="nav" aria-label="Điều hướng">
  <div class="nav-in">
    <button type="button" data-act="tab" data-v="today"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1.2 14.2l-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7z"/></svg>Hôm nay</button>
    <button type="button" data-act="tab" data-v="garden"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c-.6 0-1-.4-1-1v-5.1C7.6 15.4 5 12.5 5 9c0-.6.4-1 1-1 2.4 0 4.6 1.2 5.9 3.1.4-2.5 2-4.7 4.3-5.8.5-.2 1.1 0 1.3.5.9 2 .7 4.4-.6 6.3-1 1.5-2.6 2.6-4.4 2.9V21c0 .6-.4 1-1 1z"/></svg>Khu vườn</button>
    <button type="button" class="fab" data-act="fab" aria-label="Thêm mới"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" data-act="tab" data-v="stats"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>Thống kê</button>

<script id="habit-state" type="application/json">{"initialized":false,"habits":[],"log":{},"tasks":[]}</script>
<script>
(function(){

  var SPECIES = {

    sakura:{name:'Anh đào', crown:['#f4a9c4','#ea8db0'], flower:'#ffffff', fruit:'#c2185b', shape:'round'},
    pine:{name:'Cây thông', crown:['#3c9a68','#2d7f55'], flower:'#f6c343', fruit:'#8a5a33', shape:'pine'},
    cactus:{name:'Xương rồng', crown:['#62b073','#4d9a60'], flower:'#ff6fa1', fruit:'#ff9a3c', shape:'cactus'},
    sunflower:{name:'Hướng dương', crown:['#5fae5f','#4a984c'], flower:'#f5c242', fruit:'#7a4b24', shape:'sunflower'},
    orange:{name:'Cây cam', crown:['#3f9a52','#2f8443'], flower:'#ffffff', fruit:'#f39a1e', shape:'round'}
  };
  var SP_KEYS = Object.keys(SPECIES);
  var STAGE_AT = [0,1,3,7,15,30,60];
  var STAGE_NAME = ['Hạt giống','Nảy mầm','Cây con','Cây non','Cây lớn','Ra hoa','Kết trái'];

  // ---------- state ----------

  function migrate(){
    state.habits = state.habits || []; state.log = state.log || {}; state.tasks = state.tasks || [];
    state.habits.forEach(function(h,i){
      if (!h.emoji) h.emoji = '✅'; if (h.desc == null) h.desc = ''; if (h.tag == null) h.tag = '';
      if (!h.goal) h.goal = 1; if (h.unit == null) h.unit = ''; if (!h.target) h.target = 7;

  }

  // ---------- dates ----------
  function pad(n){ return String(n).padStart(2,'0'); }
  function key(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function today0(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
  function fromKey(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function dayDiff(a,b){ return Math.round((b-a)/864e5); }
  function mondayOf(d){ return addDays(d,-((d.getDay()+6)%7)); }
  function dm(d){ return d.getDate()+'/'+(d.getMonth()+1); }

  function seed(){
    var r=11; function rnd(){ r=(r*16807)%2147483647; return r/2147483647; }
    var t=today0();
    var ex=[
      {emoji:'💧',name:'Uống nước',desc:'Đủ 2 lít mỗi ngày',tag:'sức khoẻ',goal:8,unit:'ly',color:COLORS[0],plant:'apple',p:.85,today:6},
      {emoji:'📝',name:'Nhật ký biết ơn',desc:'Viết ra 3 điều mình biết ơn',tag:'tinh thần',goal:1,unit:'',color:COLORS[1],plant:'sakura',p:.6,today:0},
      {emoji:'🗣️',name:'Học tiếng Anh',desc:'Từ vựng và luyện nghe',tag:'ngôn ngữ',goal:15,unit:'phút',color:COLORS[2],plant:'sunflower',p:.45,today:0},
      {emoji:'🧘',name:'Thiền',desc:'Tập trung vào hơi thở',tag:'chánh niệm',goal:10,unit:'phút',color:COLORS[3],plant:'pine',p:.7,today:9},
      {emoji:'🏃',name:'Tập thể dục',desc:'Vận động 30 phút buổi sáng',tag:'thể chất',goal:30,unit:'phút',color:COLORS[5],plant:'cactus',p:.5,today:25,target:4},
      {emoji:'📚',name:'Đọc sách',desc:'Ít nhất 20 trang mỗi ngày',tag:'đọc',goal:20,unit:'trang',color:COLORS[4],plant:'orange',p:.8,today:27}
    ];
    state.habits=[]; state.log={}; state.tasks=[
      {id:'t1',title:'Mua bình nước mới',date:key(t),done:false},
      {id:'t2',title:'Đăng ký lớp yoga',date:key(t),done:true}
    ];
    ex.forEach(function(e,i){

      for (var d=days; d>=1; d--){ var x=rnd(); if (x<e.p) m[key(addDays(t,-d))]=Math.max(1,Math.round(e.goal*(.95+rnd()*.4))); else if (x<e.p+.15 && e.goal>1) m[key(addDays(t,-d))]=Math.max(1,Math.round(e.goal*rnd()*.8)); }
      if (e.today) m[key(t)]=e.today;
      state.habits.push({id:id,emoji:e.emoji,name:e.name,desc:e.desc,tag:e.tag,goal:e.goal,unit:e.unit,color:e.color,plant:e.plant,target:e.target||7,created:key(addDays(t,-days)),example:true});

  }

  // ---------- metrics ----------
  function cnt(h,k){ var m=state.log[h.id]; return (m && +m[k]) || 0; }

  function streak(h){ var d=today0(); if(!done(h,key(d))) d=addDays(d,-1); var n=0; while(done(h,key(d))){ n++; d=addDays(d,-1); } return n; }

  function rate(h,days){ var t=today0(), span=Math.min(days, dayDiff(fromKey(h.created||key(t)),t)+1), n=0; for(var i=0;i<span;i++) if(done(h,key(addDays(t,-i)))) n++; return span?n/span:0; }

  function stageFrac(h){ var s=stage(h); if (s>=STAGE_AT.length-1) return 1; return (total(h)-STAGE_AT[s])/(STAGE_AT[s+1]-STAGE_AT[s]); }

  // ---------- plant drawing ----------
  function plantSVG(h, extraClass, force){
    var sp=SPECIES[h.plant]||SPECIES.apple, s=force!=null?force:stage(h), c1=sp.crown[0], c2=sp.crown[1], o='';
    var soil='<ellipse cx="50" cy="110" rx="30" ry="6" fill="#7a5a3c" opacity=".55"/>';
    var leaf=function(x,y,rot,len,col){ return '<ellipse cx="'+x+'" cy="'+y+'" rx="'+(len/2)+'" ry="'+(len/4.2)+'" fill="'+col+'" transform="rotate('+rot+' '+x+' '+y+')"/>'; };
    if (s===0){

    } else {

                '<path d="M'+(cx-w*.8)+' '+(108-H*.45)+' L'+cx+' '+(108-H*.85)+' L'+(cx+w*.8)+' '+(108-H*.45)+'Z" fill="'+c1+'"/>'+
                '<path d="M'+(cx-w*.55)+' '+(108-H*.68)+' L'+cx+' '+top+' L'+(cx+w*.55)+' '+(108-H*.68)+'Z" fill="'+c1+'"/>';
        pts=[[cx-w*.5,108-H*.28],[cx+w*.45,108-H*.3],[cx-w*.3,108-H*.52],[cx+w*.3,108-H*.55],[cx,108-H*.75],[cx+w*.1,108-H*.36]];
      } else if (sp.shape==='cactus'){
        var cw=11*sc;
        crown = '<rect x="'+(cx-cw/2)+'" y="'+(top+4)+'" width="'+cw+'" height="'+(H-4)+'" rx="'+(cw/2)+'" fill="'+c1+'"/>'+
          (s>=4?'<path d="M'+(cx-cw/2)+' '+(108-H*.45)+' h-'+(8*sc)+' v-'+(H*.25)+'" stroke="'+c2+'" stroke-width="'+(8*sc)+'" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M'+(cx+cw/2)+' '+(108-H*.6)+' h'+(8*sc)+' v-'+(H*.2)+'" stroke="'+c2+'" stroke-width="'+(8*sc)+'" stroke-linecap="round" stroke-linejoin="round" fill="none"/>':'')+

        var head=function(x,y,r){ var p=''; for (var i=0;i<12;i++){ var a=i*30; p+='<ellipse cx="'+x+'" cy="'+(y-r)+'" rx="'+(r*.32)+'" ry="'+(r*.62)+'" fill="'+sp.flower+'" transform="rotate('+a+' '+x+' '+y+')"/>'; } return p+'<circle cx="'+x+'" cy="'+y+'" r="'+(r*.62)+'" fill="#7a4b24"/>'; };
        crown = head(50, top+12*sc, 11*sc);
        if (s>=5) crown += '<path d="M50 '+(108-H*.4)+' Q36 '+(108-H*.5)+' 32 '+(108-H*.62)+'" stroke="#4f9d55" stroke-width="2.5" fill="none"/>'+head(32,108-H*.62,7*sc);
        if (s>=6) crown += '<path d="M50 '+(108-H*.55)+' Q64 '+(108-H*.62)+' 68 '+(108-H*.74)+'" stroke="#4f9d55" stroke-width="2.5" fill="none"/>'+head(68,108-H*.74,7*sc);

      if (s>=5 && pts.length) pts.slice(0,s>=6?3:5).forEach(function(p){ deco += sp.shape==='cactus' ? '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="'+sp.flower+'"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="1.6" fill="#ffe08a"/>' : '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(2.6*sc+.6)+'" fill="'+sp.flower+'"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="1" fill="#f6c343"/>'; });

  }

  // ---------- save ----------
  var api=null, readOnly=false, timer=null, pending=false, saveState='idle';
  var SAVE_TXT={idle:'Mọi thay đổi đã được lưu',pending:'Có thay đổi chưa lưu',saving:'Đang lưu…',saved:'Đã lưu',local:'Đã lưu trên máy này',readonly:'Chế độ chỉ xem: thay đổi sẽ không được lưu',error:'Chưa lưu được. App sẽ thử lại ở lần thay đổi sau',conflict:'Có bản mới hơn, đang tải lại'};
  function setSave(s){ saveState=s; var el=document.getElementById('sdot'); if(el){ el.dataset.s=s; el.title=SAVE_TXT[s]; } var t=document.getElementById('stext'); if(t) t.textContent=SAVE_TXT[s]; }
  function buildDoc(){ var json=JSON.stringify(state).replace(/</g,'\\u003c'); return RAW.replace(/(<script id="habit-state" type="application\/json">)[\s\S]*?(<\/script>)/, function(_,a,b){ return a+json+b; }); }
  function schedule(){ clearTimeout(timer); if (sheetOpen()) return; timer=setTimeout(save, BUILD==='artifact'?2500:400); }
  function changed(){ state.initialized=true; pending=true; setSave(readOnly?'readonly':'pending'); render(); schedule(); }
  function save(){
    if (!pending) return; pending=false; clearTimeout(timer);
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
    if (api && !readOnly){
      setSave('saving');
      Promise.resolve().then(function(){ return api.publish(buildDoc()); }).then(function(){ setSave('saved'); }).catch(function(e){
        var c=String((e&&(e.code||e.name||e.message))||'');
        if (/not_granted|not_writer/.test(c)){ readOnly=true; setSave('readonly'); } else if (/conflict/.test(c)) setSave('conflict'); else setSave('error');
      });

  }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState==='hidden') save(); });
  if (BUILD==='artifact' && window.claude && typeof window.claude.use==='function'){
    window.claude.use('artifact').then(function(a){ api=a; if (pending) schedule(); }).catch(function(){});
  }
  if (BUILD==='pwa' && 'serviceWorker' in navigator && location.protocol==='https:'){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }

  // ---------- ui state ----------
  var TABS=['today','garden','stats','settings'];
  var ui={tab:TABS.indexOf(location.hash.slice(1))>=0?location.hash.slice(1):'today', seg:'habit', sel:today0(), sheet:null, arm:null};
  try { var ss=sessionStorage.getItem('ht-ui'); if (ss){ var u=JSON.parse(ss); if (u.seg) ui.seg=u.seg; if (u.sel && fromKey(u.sel)<=today0()) ui.sel=fromKey(u.sel); } } catch(e){}
  function blankFilter(){ return {q:'',status:'all',tags:[],goal:'all',target:[],plant:[],color:[]}; }
  ui.filter=blankFilter();
  try { var sf=JSON.parse(sessionStorage.getItem('ht-ui')||'{}').filter; if (sf) ui.filter=Object.assign(blankFilter(),sf); } catch(e){}
  function remember(){ try { sessionStorage.setItem('ht-ui', JSON.stringify({seg:ui.seg, sel:key(ui.sel), filter:ui.filter})); } catch(e){} }
  function norm(x){ return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'); }
  function filterCount(){ var f=ui.filter; return (f.q.trim()?1:0)+(f.status!=='all'?1:0)+(f.goal!=='all'?1:0)+f.tags.length+f.target.length+f.plant.length+f.color.length; }
  function matches(h,k){
    var f=ui.filter;
    if (f.q.trim()){ var q=norm(f.q.trim()); if (norm(h.name+' '+h.desc+' '+h.tag+' '+h.unit).indexOf(q)<0) return false; }
    if (f.status==='todo' && done(h,k)) return false;
    if (f.status==='done' && !done(h,k)) return false;
    if (f.goal==='check' && h.goal!==1) return false;
    if (f.goal==='count' && h.goal===1) return false;
    if (f.tags.length && f.tags.indexOf(h.tag||'')<0) return false;
    if (f.target.length && f.target.indexOf(String(h.target))<0) return false;
    if (f.plant.length && f.plant.indexOf(h.plant)<0) return false;
    if (f.color.length && f.color.indexOf(h.color)<0) return false;
    return true;
  }
  function uniq(arr){ return arr.filter(function(x,i){ return arr.indexOf(x)===i; }); }
  var FILTER_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var CH_L='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>';
  var CH_R='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>';
  function H(id){ return state.habits.find(function(h){ return h.id===id; }); }
  function fmtAmt(h,n){ return h.goal>1 ? n+'/'+h.goal+(h.unit?' '+esc(h.unit):'') : ''; }

  var toastT=null;
  function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },2600); }

  function setCount(h,k,n){
    var before=stage(h), wasDone=done(h,k);

    var m=state.log[h.id]||(state.log[h.id]={});
    if (n===0) delete m[k]; else m[k]=n;
    var after=stage(h);
    if (after>before) toast('🌱 '+h.name+': cây đã lên “'+STAGE_NAME[after]+'”!');
    else if (!wasDone && done(h,k)) toast('💧 Đã tưới cây '+h.name);

  }

  // ---------- render ----------
  function renderTop(){
    var t=today0(), s=ui.sel, isToday=key(s)===key(t), html='<div class="bar"><div class="brand">Thói quen<i id="sdot" data-s="'+saveState+'"></i></div>';
    if (ui.tab==='today'){
      html += '<div class="title">'+(isToday?'Hôm nay, ':DOW_FULL[s.getDay()]+', ')+dm(s)+'</div><div class="bar-r"><button class="ib" type="button" data-act="week" data-v="-1" aria-label="Tuần trước">'+CH_L+'</button><button class="ib" type="button" data-act="week" data-v="1" aria-label="Tuần sau"'+(mondayOf(s)>=mondayOf(t)?' disabled':'')+'>'+CH_R+'</button></div></div>';
      var m=mondayOf(s); html+='<div class="week">';
      for (var i=0;i<7;i++){ var d=addDays(m,i); html+='<button type="button" class="day'+(key(d)===key(s)?' sel':'')+(key(d)===key(t)?' today':'')+'" data-act="day" data-v="'+key(d)+'"'+(d>t?' disabled':'')+'><small>'+DOW[d.getDay()]+'</small><b>'+d.getDate()+'</b></button>'; }
      html+='</div><div class="subbar"><div class="seg"><button type="button" data-act="seg" data-v="habit" aria-pressed="'+(ui.seg==='habit')+'">Thói quen</button><button type="button" data-act="seg" data-v="task" aria-pressed="'+(ui.seg==='task')+'">Việc cần làm</button></div>'+(isToday?'':'<button class="chip-btn" type="button" data-act="gotoday">Hôm nay</button>')+'</div>';
    } else {
      html += '<div class="title">'+{garden:'Khu vườn',stats:'Thống kê',settings:'Cài đặt'}[ui.tab]+'</div><div></div></div>';

  function habitCard(h,k,future,reo){
    var c=cnt(h,k), pct=Math.round(c/h.goal*100), isDone=c>=h.goal, btn;
    var lab=h.goal>1?('Thêm '+stepOf(h)+(h.unit?' '+h.unit:'')+' cho '+h.name):((isDone?'Bỏ đánh dấu ':'Đánh dấu xong ')+h.name);
    if (h.goal===1) btn='<button class="pill circle'+(isDone?' on':'')+'" type="button" data-act="inc" data-v="'+h.id+'" aria-label="'+esc(lab)+'"'+(future?' disabled':'')+'>'+(isDone?CHECK:'')+'</button>';
    else btn='<button class="pill'+(c===0?' zero':'')+'" type="button" data-act="inc" data-v="'+h.id+'" aria-label="'+esc(lab)+'"'+(future?' disabled':'')+'>'+pct+'%</button>';
    if (reo) btn='<span class="mvs"><button class="ib" type="button" data-act="mv" data-v="'+h.id+'" data-d="-1" aria-label="Đưa '+esc(h.name)+' lên"'+(reo.i===0?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 15l6-6 6 6"/></svg></button><button class="ib" type="button" data-act="mv" data-v="'+h.id+'" data-d="1" aria-label="Đưa '+esc(h.name)+' xuống"'+(reo.i===reo.n-1?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button></span>';
    return '<div class="card'+(isDone?' done':'')+(reo?' reo':'')+'" data-id="'+h.id+'" style="--hc:'+h.color+'">'+
      '<button class="body" type="button"'+(reo?' tabindex="-1"':' data-act="open" data-v="'+h.id+'"')+'><span class="emo">'+esc(h.emoji)+'</span><span class="info"><span class="nm">'+esc(h.name)+'</span>'+(h.desc?'<span class="desc">'+esc(h.desc)+'</span>':'')+
      '<span class="meta">'+(h.tag?'<span class="tag">'+esc(h.tag)+'</span>':'')+(h.goal>1?'<span>'+fmtAmt(h,c)+'</span>':'')+'</span></span></button>'+
      btn+(!reo&&pct>100?'<span class="medal" aria-label="Vượt mục tiêu">🏅</span>':'')+(h.goal>1&&c>0?'<span class="prog" style="width:'+Math.min(pct,100)+'%"></span>':'')+'</div>';
  }

  function exampleNotice(){ return state.habits.some(function(h){return h.example;}) ? '<div class="notice"><span>Đây là dữ liệu mẫu để bạn xem thử.</span><button class="lnk" type="button" data-act="clear-ex">Xoá dữ liệu mẫu</button></div>' : ''; }

  function renderToday(){
    var k=key(ui.sel), future=ui.sel>today0(), html=exampleNotice();
    if (ui.seg==='habit'){
      var hs=state.habits, n=hs.filter(function(h){return done(h,k);}).length;
      if (!hs.length) return html+'<div class="empty"><div style="font-size:44px">🌰</div><div>Chưa có thói quen nào. Mỗi thói quen sẽ là một hạt giống trong khu vườn của bạn.</div><button class="btn" type="button" data-act="new">Trồng thói quen đầu tiên</button></div>';
      var fc=filterCount(), tags=uniq(hs.map(function(h){return h.tag;}).filter(Boolean));
      if (!ui.reorder){
        html += '<div class="chips"><button class="fchip" type="button" data-act="filter" aria-pressed="'+(fc>0)+'">'+FILTER_ICON+'Bộ lọc'+(fc?'<span class="n">'+fc+'</span>':'')+'</button><button class="fchip" type="button" data-act="ftag-all" aria-pressed="'+(!ui.filter.tags.length)+'">Tất cả</button>';
        tags.forEach(function(t){ html+='<button class="fchip" type="button" data-act="ftag" data-v="'+esc(t)+'" aria-pressed="'+(ui.filter.tags.indexOf(t)>=0)+'">'+esc(t)+'</button>'; });
        html += '</div>';
      }
      html += '<div class="sum"><span><b>'+n+'/'+hs.length+'</b> thói quen đã xong</span><span class="track"><i style="width:'+(n/hs.length*100)+'%"></i></span><button class="lnk" type="button" data-act="reorder">'+(ui.reorder?'Xong':'Sắp xếp')+'</button></div>';
      if (ui.reorder){
        html += '<div class="cap">Bấm mũi tên để đổi thứ tự. Thứ tự này cũng áp dụng cho khu vườn và thống kê.</div>';
        hs.forEach(function(h,i){ html+=habitCard(h,k,future,{i:i,n:hs.length}); });
      } else {
       var all=hs; hs=hs.filter(function(h){ return matches(h,k); });
       if (fc) html += '<div class="cap">Đang hiện '+hs.length+'/'+all.length+' thói quen theo bộ lọc · <button class="lnk" type="button" data-act="fclear">Xoá bộ lọc</button></div>';
       if (!hs.length) html += '<div class="empty">Không có thói quen nào khớp bộ lọc.<button class="btn ghost" type="button" data-act="fclear">Xoá bộ lọc</button></div>';
       if (state.sortDone!==false){
        var todo=hs.filter(function(h){return !done(h,k);}), fin=hs.filter(function(h){return done(h,k);});
        todo.forEach(function(h){ html+=habitCard(h,k,future); });
        if (fin.length){ if (todo.length) html+='<div class="grp">Đã hoàn thành · '+fin.length+'</div>'; fin.forEach(function(h){ html+=habitCard(h,k,future); }); }
       } else hs.forEach(function(h){ html+=habitCard(h,k,future); });
      }
    } else {
      var ts=state.tasks.filter(function(t){ return t.date===k; });
      html += '<form class="taskadd" id="taskForm"><input id="taskInput" type="text" maxlength="120" placeholder="Thêm việc cho '+dm(ui.sel)+'…" aria-label="Việc cần làm mới" autocomplete="off"><button class="btn" type="submit">Thêm</button></form>';
      if (!ts.length) html += '<div class="empty">Chưa có việc nào cho ngày này.</div>';
      ts.forEach(function(t){ html+='<div class="task'+(t.done?' on':'')+'"><button class="chk" type="button" data-act="task-t" data-v="'+t.id+'" aria-pressed="'+t.done+'" aria-label="Đánh dấu xong">'+(t.done?CHECK:'')+'</button><span class="tx">'+esc(t.title)+'</span><button class="x" type="button" data-act="task-d" data-v="'+t.id+'" aria-label="Xoá việc này">✕</button></div>'; });
    }
    return html;
  }

  function renderGarden(){
    var hs=state.habits;
    if (!hs.length) return '<div class="empty"><div style="font-size:44px">🌰</div><div>Khu vườn còn trống. Thêm một thói quen để gieo hạt đầu tiên.</div><button class="btn" type="button" data-act="new">Gieo hạt</button></div>';
    var bloom=hs.filter(function(h){return stage(h)>=5;}).length, th=hs.filter(thirsty).length;
    var html='<section class="scene"><span class="sun"></span><h2>Khu vườn của bạn</h2><p>'+hs.length+' cây · '+bloom+' cây ra hoa'+(th?' · '+th+' cây cần tưới':'')+'</p><div class="row-plants">';
    hs.forEach(function(h){ html+='<div class="pl" title="'+esc(h.name)+'">'+plantSVG(h)+'</div>'; });
    html+='</div><div class="ground"></div></section><div class="plots">';
    hs.forEach(function(h){
      var s=stage(h), nx=toNext(h);
      html+='<button class="plot" type="button" data-act="open" data-v="'+h.id+'" style="--hc:'+h.color+'">'+plantSVG(h)+'<span class="pn">'+esc(h.emoji)+' '+esc(h.name)+'</span>'+
        (thirsty(h)?'<span class="badge thirsty">Cần tưới</span>':'<span class="badge">'+STAGE_NAME[s]+'</span>')+
        '<span class="ps">'+(nx?'Còn '+nx+' lần để lên “'+STAGE_NAME[s+1]+'”':'Cây đã trưởng thành')+'</span><span class="mini"><i style="width:'+Math.round(stageFrac(h)*100)+'%"></i></span></button>';
    });
    html+='</div><div class="panel"><h3>Cách cây lớn lên</h3><div class="cap">Mỗi ngày bạn đạt mục tiêu là một lần tưới. Cây lên giai đoạn mới sau 1, 3, 7, 15, 30 và 60 lần tưới. Nếu 3 ngày liền không tưới, cây sẽ héo; hoàn thành lại thói quen là cây tươi trở lại, và cây không bao giờ bị mất.</div><div class="legend">'+STAGE_NAME.map(function(n,i){return '<span>'+STAGE_AT[i]+' lần · '+n+'</span>';}).join('')+'</div></div>';
    return html;
  }

  function heatHTML(h,weeks){
    var t=today0(), start=addDays(mondayOf(t),-7*(weeks-1)), o='';
    for (var i=0;i<weeks*7;i++){ var d=addDays(start,i), c=cnt(h,key(d)); o+='<i class="'+(d>t?'f':c>=h.goal?'on':c>0?'p':'')+'" title="'+dm(d)+'"></i>'; }
    return '<div class="heat-wrap"><div class="heat" style="--hc:'+h.color+'">'+o+'</div></div>';
  }

  function renderStats(){
    var hs=state.habits, t=today0(), tk=key(t);
    if (!hs.length) return '<div class="empty">Chưa có dữ liệu. Thêm thói quen để xem thống kê.</div>';
    var n=hs.filter(function(h){return done(h,tk);}).length;
    var best=hs.reduce(function(a,h){ var s=streak(h); return s>a.s?{s:s,h:h}:a; },{s:0,h:null});
    var avg=Math.round(hs.reduce(function(a,h){return a+rate(h,30);},0)/hs.length*100);
    var html='<div class="tiles"><div class="tile"><b>'+n+'/'+hs.length+'</b><span>Xong hôm nay</span></div><div class="tile"><b>'+best.s+'</b><span>Chuỗi dài nhất'+(best.h?': '+esc(best.h.name):'')+'</span></div><div class="tile"><b>'+avg+'%</b><span>Tỉ lệ 30 ngày</span></div></div>';
    var m=mondayOf(addDays(t,ui.wk*7||0));
    html+='<section class="panel"><div class="hhead" style="align-items:center"><h3>Tuần '+dm(m)+' – '+dm(addDays(m,6))+'</h3><div class="bar-r"><button class="ib" type="button" data-act="swk" data-v="-1" aria-label="Tuần trước">'+CH_L+'</button><button class="ib" type="button" data-act="swk" data-v="1" aria-label="Tuần sau"'+((ui.wk||0)>=0?' disabled':'')+'>'+CH_R+'</button></div></div><div class="wgrid"><span></span>';
    for (var i=0;i<7;i++){ var d=addDays(m,i); html+='<span class="hd">'+DOW[d.getDay()]+'<b>'+d.getDate()+'</b></span>'; }
    hs.forEach(function(h){
      html+='<span class="hn">'+esc(h.emoji)+' '+esc(h.name)+'</span>';
      for (var i=0;i<7;i++){ var d=addDays(m,i), k=key(d), c=cnt(h,k); html+='<button type="button" class="wc'+(c>=h.goal?' on':c>0?' part':'')+'" style="--hc:'+h.color+'" data-act="cell" data-v="'+h.id+'" data-k="'+k+'"'+(d>t?' disabled':'')+' aria-label="'+esc(h.name)+' '+dm(d)+'">'+(c>=h.goal?CHECK:'')+'</button>'; }
    });
    html+='</div></section><section class="panel"><h3>Từng thói quen · 18 tuần</h3>';
    hs.forEach(function(h){ html+='<div class="hrow"><div class="hhead"><b>'+esc(h.emoji)+' '+esc(h.name)+'</b><span class="cap">Chuỗi '+streak(h)+' · Dài nhất '+longest(h)+' · '+Math.round(rate(h,30)*100)+'%</span></div>'+heatHTML(h,18)+'</div>'; });
    return html+'</section>';
  }

  function renderSettings(){
    var ex=state.habits.some(function(h){return h.example;});
    var html='<section class="panel"><h3>Lưu dữ liệu</h3><div class="cap" id="stext">'+SAVE_TXT[saveState]+'</div><div class="cap">'+(BUILD==='artifact'?'Dữ liệu được lưu ngay trên trang này, mở ở máy nào cũng thấy.':'Dữ liệu chỉ nằm trên trình duyệt của máy này. Hãy xuất file sao lưu định kỳ, hoặc dùng file đó để chuyển sang máy khác.')+'</div>';

    html+='</section><section class="panel"><h3>Hiển thị</h3><label class="switch" for="sortDone"><span>Đưa thói quen đã hoàn thành xuống dưới</span><input type="checkbox" id="sortDone"'+(state.sortDone!==false?' checked':'')+'></label></section>';

  function render(){
    renderTop();
    var mainEl=document.getElementById('main'), old={};
    mainEl.querySelectorAll('.card[data-id]').forEach(function(c){ old[c.dataset.id]=c.getBoundingClientRect().top; });
    mainEl.innerHTML = ui.tab==='today'?renderToday():ui.tab==='garden'?renderGarden():ui.tab==='stats'?renderStats():renderSettings();
    if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)){
      mainEl.querySelectorAll('.card[data-id]').forEach(function(c){
        var o=old[c.dataset.id]; if (o==null) return; var dy=o-c.getBoundingClientRect().top; if (Math.abs(dy)<2) return;
        c.style.transition='none'; c.style.transform='translateY('+dy+'px)'; c.style.zIndex='1';
        requestAnimationFrame(function(){ requestAnimationFrame(function(){ c.style.transition='transform .38s cubic-bezier(.2,.8,.2,1)'; c.style.transform=''; setTimeout(function(){ c.style.zIndex=''; c.style.transition=''; },420); }); });

    if (ui.sheet && ui.sheet.type==='detail') renderSheet();
  }

        '<div class="plant-hero">'+plantSVG(h)+'<div><b>'+SPECIES[h.plant].name+' · '+(thirsty(h)?'đang héo':STAGE_NAME[st])+'</b><div class="cap">'+(thirsty(h)?'Đã 3 ngày chưa tưới. Hoàn thành thói quen để cây tươi lại.':nx?'Còn '+nx+' lần đạt mục tiêu để lên “'+STAGE_NAME[st+1]+'”.':'Cây đã kết trái. Tuyệt vời!')+'</div></div></div>'+

    } else if (s.type==='filter'){

        grp('Màu', colors.map(function(c,i){ return chip('color',c,'Màu '+(COLORS.indexOf(c)+1),f.color.indexOf(c)>=0,'<span class="sw" style="background:'+c+'"></span>'); }).join(''))+
        '<div class="btns" style="justify-content:space-between"><button class="btn ghost" type="button" data-act="fclear">Xoá bộ lọc</button><button class="btn" type="button" data-act="close" id="fApply">'+fResultLabel()+'</button></div>';

      var e=s.id?H(s.id):null, d=e||{emoji:EMOJIS[state.habits.length%EMOJIS.length],name:'',desc:'',tag:'',goal:1,unit:'',target:7,color:COLORS[state.habits.length%COLORS.length],plant:SP_KEYS[state.habits.length%SP_KEYS.length]};
      var opts=''; for (var i=7;i>=1;i--) opts+='<option value="'+i+'"'+(i===d.target?' selected':'')+'>'+(i===7?'Mỗi ngày':i+' ngày/tuần')+'</option>';
      el.innerHTML='<div class="sh-head"><h2>'+(e?'Sửa thói quen':'Thói quen mới')+'</h2>'+CLOSE+'</div><form class="f" id="habitForm" autocomplete="off">'+
        '<div class="fld"><label for="fName">Tên</label><input id="fName" type="text" maxlength="60" required value="'+esc(d.name)+'" placeholder="Ví dụ: Uống nước" data-focus></div>'+
        '<div class="fld"><label for="fDesc">Mô tả ngắn</label><input id="fDesc" type="text" maxlength="90" value="'+esc(d.desc)+'" placeholder="Ví dụ: Đủ 2 lít mỗi ngày"></div>'+
        '<div class="two"><div class="fld"><label for="fGoal">Mục tiêu mỗi ngày</label><input id="fGoal" type="number" inputmode="numeric" min="1" max="999" value="'+d.goal+'"></div><div class="fld"><label for="fUnit">Đơn vị</label><input id="fUnit" type="text" maxlength="12" value="'+esc(d.unit)+'" placeholder="ly, phút, trang…"></div></div>'+
        '<div class="two"><div class="fld"><label for="fTag">Nhãn</label><input id="fTag" type="text" maxlength="20" value="'+esc(d.tag)+'" placeholder="sức khoẻ"></div><div class="fld"><label for="fTarget">Số ngày mỗi tuần</label><select id="fTarget">'+opts+'</select></div></div>'+
        '<div class="fld"><span>Biểu tượng</span><div class="pick">'+EMOJIS.map(function(x,i){ return '<label><input type="radio" name="fEmoji" value="'+x+'"'+(x===d.emoji?' checked':'')+' aria-label="'+x+'"><span>'+x+'</span></label>'; }).join('')+'</div></div>'+
        '<div class="fld"><span>Màu</span><div class="pick sw">'+COLORS.map(function(x,i){ return '<label><input type="radio" name="fColor" value="'+x+'"'+(x===d.color?' checked':'')+' aria-label="Màu '+(i+1)+'"><span style="background:'+x+'"></span></label>'; }).join('')+'</div></div>'+
        '<div class="fld"><span>Loại cây trong vườn</span><div class="pick pl">'+SP_KEYS.map(function(x){ return '<label><input type="radio" name="fPlant" value="'+x+'"'+(x===d.plant?' checked':'')+'><span>'+plantSVG({id:'_',plant:x,goal:1},'',5)+SPECIES[x].name+'</span></label>'; }).join('')+'</div></div>'+
        '<div class="btns" style="justify-content:space-between">'+(e?'<button class="btn danger" type="button" data-act="del" data-v="'+e.id+'">'+(ui.arm==='del'?'Bấm lần nữa để xoá':'Xoá')+'</button>':'<span></span>')+'<button class="btn" type="submit">'+(e?'Lưu thay đổi':'Gieo hạt')+'</button></div></form>';
    }
  }
  function fResultLabel(){ var k=key(ui.sel), n=state.habits.filter(function(h){return matches(h,k);}).length; return 'Xem '+n+' thói quen'; }
  function stats4(h){ return '<div><b>'+streak(h)+'</b><span>Chuỗi hiện tại</span></div><div><b>'+longest(h)+'</b><span>Dài nhất</span></div><div><b>'+Math.round(rate(h,30)*100)+'%</b><span>30 ngày</span></div><div><b>'+total(h)+'</b><span>Lần tưới</span></div>'; }

  // ---------- events ----------
  document.addEventListener('click', function(ev){
    var el=ev.target.closest('[data-act]'); if (!el || el.disabled) return;
    var a=el.dataset.act, v=el.dataset.v, h;
    if (a!=='wipe' && a!=='del' && ui.arm){ ui.arm=null; }
    switch(a){
      case 'tab': ui.reorder=false; ui.tab=v; try{ history.replaceState(null,'','#'+v); }catch(e){ location.hash=v; } window.scrollTo(0,0); render(); break;
      case 'seg': ui.seg=v; remember(); render(); break;
      case 'day': ui.sel=fromKey(v); remember(); render(); break;
      case 'gotoday': ui.sel=today0(); remember(); render(); break;
      case 'week': var n=addDays(ui.sel,7*(+v)); if (n>today0()) n=today0(); ui.sel=n; remember(); render(); break;
      case 'swk': ui.wk=Math.min(0,(ui.wk||0)+(+v)); render(); break;
      case 'inc': h=H(v); if(!h) break; var k=key(ui.sel), c=cnt(h,k); setCount(h,k,h.goal===1?(c?0:1):c+stepOf(h)); break;
      case 'reorder': ui.reorder=!ui.reorder; render(); break;
      case 'filter': openSheet({type:'filter'}); break;
      case 'ftag-all': ui.filter.tags=[]; remember(); render(); break;
      case 'ftag': var ti2=ui.filter.tags.indexOf(v); if (ti2>=0) ui.filter.tags.splice(ti2,1); else ui.filter.tags.push(v); remember(); render(); break;
      case 'fclear': ui.filter=blankFilter(); remember(); render(); if (ui.sheet&&ui.sheet.type==='filter') renderSheet(); break;
      case 'fset':
        var g=el.dataset.g, F=ui.filter;
        if (Array.isArray(F[g])){ var j=F[g].indexOf(v); if (j>=0) F[g].splice(j,1); else F[g].push(v); } else F[g]=v;
        remember(); render(); renderSheet(); break;
      case 'mv': var ix=state.habits.findIndex(function(x){return x.id===v;}), to=ix+(+el.dataset.d); if (ix<0||to<0||to>=state.habits.length) break; var it=state.habits.splice(ix,1)[0]; state.habits.splice(to,0,it); changed(); break;
      case 'open': openSheet({type:'detail',id:v}); break;
      case 'edit': openSheet({type:'form',id:v}); break;
      case 'new': openSheet({type:'form'}); break;
      case 'fab':
        if (ui.tab==='today' && ui.seg==='task'){ var ti=document.getElementById('taskInput'); if (ti) ti.focus(); }
        else openSheet({type:'form'});
        break;
      case 'close': closeSheet(); break;
      case 'd-step': h=H(ui.sheet.id); if(!h) break; var kk=key(ui.sel); setCount(h,kk,cnt(h,kk)+(+v)*stepOf(h)); break;
      case 'cell': h=H(v); if(!h) break; if (h.goal===1){ setCount(h,el.dataset.k,cnt(h,el.dataset.k)?0:1); } else { ui.sel=fromKey(el.dataset.k); remember(); openSheet({type:'detail',id:v}); } break;
      case 'task-t': var t=state.tasks.find(function(x){return x.id===v;}); if(t){ t.done=!t.done; changed(); } break;
      case 'task-d': state.tasks=state.tasks.filter(function(x){return x.id!==v;}); changed(); break;
      case 'del':
        if (ui.arm!=='del'){ ui.arm='del'; renderSheet(); break; }
        state.habits=state.habits.filter(function(x){return x.id!==v;}); delete state.log[v]; closeSheet(); changed(); break;
      case 'clear-ex':
        state.habits=state.habits.filter(function(x){ if (x.example){ delete state.log[x.id]; return false; } return true; });
        state.tasks=state.tasks.filter(function(x){ return x.id!=='t1' && x.id!=='t2'; }); changed(); break;
      case 'wipe':
        if (ui.arm!=='wipe'){ ui.arm='wipe'; render(); break; }
        ui.arm=null; state.habits=[]; state.log={}; state.tasks=[]; changed(); toast('Đã xoá toàn bộ dữ liệu'); break;
      case 'export':
        save();
        var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}), aEl=document.createElement('a');
        aEl.href=URL.createObjectURL(blob); aEl.download='thoi-quen-'+key(today0())+'.json'; document.body.appendChild(aEl); aEl.click(); aEl.remove();
        setTimeout(function(){ URL.revokeObjectURL(aEl.href); },1000);
        var bm=document.getElementById('bmsg'); if (bm) bm.textContent='Đã tạo file sao lưu.'; break;
    }
  });
  document.getElementById('ov').addEventListener('click', function(e){ if (e.target.id==='ov') closeSheet(); });
  document.addEventListener('keydown', function(e){ if (e.key==='Escape' && ui.sheet) closeSheet(); });
  document.addEventListener('change', function(e){
    if (e.target.id==='sortDone'){ state.sortDone=e.target.checked; changed(); }
    if (e.target.id==='dVal'){ var h=H(ui.sheet&&ui.sheet.id); if (h){ var v=e.target.value; e.target.blur(); setCount(h,key(ui.sel),+v); } }
    if (e.target.id==='importFile'){
      var f=e.target.files&&e.target.files[0], input=e.target; if(!f) return;
      f.text().then(function(txt){ var p=JSON.parse(txt); if(!p||!Array.isArray(p.habits)||typeof p.log!=='object') throw 0; state=p; migrate(); state.initialized=true; changed(); save(); var bm=document.getElementById('bmsg'); if (bm) bm.textContent='Đã khôi phục '+state.habits.length+' thói quen từ file.'; })
       .catch(function(){ var bm=document.getElementById('bmsg'); if (bm) bm.textContent='File không đúng định dạng. Hãy chọn file .json được xuất từ app này.'; })
       .then(function(){ input.value=''; });
    }
  });
  document.addEventListener('input', function(e){
    if (e.target.id==='fQ'){ ui.filter.q=e.target.value; remember(); render(); var b=document.getElementById('fApply'); if (b) b.textContent=fResultLabel(); }
  });
  document.addEventListener('submit', function(e){
    e.preventDefault();
    if (e.target.id==='taskForm'){
      var i=document.getElementById('taskInput'), t=i.value.trim(); if(!t) return;
      state.tasks.push({id:'t'+Date.now().toString(36),title:t,date:key(ui.sel),done:false}); changed();
      var ni=document.getElementById('taskInput'); if (ni) ni.focus();
    }
    if (e.target.id==='habitForm'){
      var g=function(id){ return document.getElementById(id).value.trim(); };
      var r=function(n){ var x=document.querySelector('input[name="'+n+'"]:checked'); return x?x.value:null; };
      var name=g('fName'); if(!name){ document.getElementById('fName').focus(); return; }
      var data={name:name,desc:g('fDesc'),tag:g('fTag'),goal:Math.max(1,Math.min(999,parseInt(g('fGoal'),10)||1)),unit:g('fUnit'),target:+g('fTarget'),emoji:r('fEmoji')||'✅',color:r('fColor')||COLORS[0],plant:r('fPlant')||'apple'};
      var ex=ui.sheet.id?H(ui.sheet.id):null;
      if (ex){ Object.assign(ex,data); delete ex.example; closeSheet(); changed(); }
      else { var id='h'+Date.now().toString(36); data.id=id; data.created=key(today0()); state.habits.push(data); state.log[id]={}; closeSheet(); changed(); toast('🌰 Đã gieo hạt cho “'+name+'”'); }
    }
  });
  window.addEventListener('hashchange', function(){ var t=location.hash.slice(1); if (TABS.indexOf(t)>=0 && t!==ui.tab){ ui.tab=t; render(); } });

  // Block pinch-zoom on iOS (Safari ignores user-scalable=no); double-tap zoom is stopped by touch-action above
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }, {passive:false}); });
  document.addEventListener('touchmove', function(e){ if (e.touches && e.touches.length > 1) e.preventDefault(); }, {passive:false});

  render();
})();
</script>
</body>
